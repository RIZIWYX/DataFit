# L'adresse d'entrée du site depuis l'extérieur du cluster. Demande un contrôleur Ingress nginx
# (minikube : « minikube addons enable ingress » ; kind : voir docs/kubernetes.md).
# En local, ajouter « <IP du cluster> datafit.local » au fichier hosts.
# Sans Ingress, « kubectl -n datafit port-forward svc/frontend 3000:80 » suffit pour essayer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datafit
  namespace: datafit
  labels: { app.kubernetes.io/part-of: datafit }
  annotations:
    # petits corps de requête suffisent : l'API ne reçoit que du JSON
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  # En ligne : ajouter un certificat TLS (cert-manager) puis passer SESSION_COOKIE_SECURISE à "true"
  # tls:
  #   - hosts: [datafit.exemple.fr]
  #     secretName: datafit-tls
  rules:
    - host: datafit.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
