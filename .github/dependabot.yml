# Dependabot ouvre une PR quand une bibliothèque a une nouvelle version ou une faille connue.
# Les mises à jour mineures et correctives d'un même dossier sont regroupées dans une seule PR
# par semaine. Les versions majeures (qui peuvent casser le code) restent dans des PR séparées,
# limitées à 3 ouvertes en même temps par dossier. La CI les teste comme n'importe quelle PR.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      mineures:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      mineures:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /analyse
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      mineures:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /simulateur
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      mineures:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      mineures:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      mineures:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /analyse
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      mineures:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /simulateur
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      mineures:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      mineures:
        update-types: [minor, patch]
