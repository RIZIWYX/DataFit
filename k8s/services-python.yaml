# Les deux services Python (FastAPI), appelés uniquement par le backend : jamais exposés dehors.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulateur
  namespace: datafit
  labels: { app: simulateur, app.kubernetes.io/part-of: datafit }
spec:
  replicas: 1
  selector:
    matchLabels: { app: simulateur }
  template:
    metadata:
      labels: { app: simulateur, app.kubernetes.io/part-of: datafit }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: simulateur
          image: datafit-simulateur:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /sante, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /sante, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: simulateur
  namespace: datafit
  labels: { app: simulateur, app.kubernetes.io/part-of: datafit }
spec:
  type: ClusterIP
  selector: { app: simulateur }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyse
  namespace: datafit
  labels: { app: analyse, app.kubernetes.io/part-of: datafit }
spec:
  replicas: 1
  selector:
    matchLabels: { app: analyse }
  template:
    metadata:
      labels: { app: analyse, app.kubernetes.io/part-of: datafit }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: analyse
          image: datafit-analyse:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8001 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }   # cache de matplotlib (MPLCONFIGDIR=/tmp/matplotlib)
          readinessProbe:
            httpGet: { path: /sante, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /sante, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: analyse
  namespace: datafit
  labels: { app: analyse, app.kubernetes.io/part-of: datafit }
spec:
  type: ClusterIP
  selector: { app: analyse }
  ports:
    - { name: http, port: 8001, targetPort: http }
