server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Les appels /api/... sont transmis au conteneur "backend"
    location /api/ {
        proxy_pass http://backend:8080;
        # on garde l'adresse tapée dans le navigateur (localhost:3000) : sans ça, Spring
        # voit arriver « backend:8080 », croit l'appel venu d'un autre site et le refuse (CORS)
        proxy_set_header Host $http_host;
    }

    # Toute autre adresse (/dashboard, /profil...) renvoie index.html :
    # c'est React Router qui choisit la page (même rôle que vercel.json)
    location / {
        try_files $uri /index.html;
    }
}
