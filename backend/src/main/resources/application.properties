spring.application.name=backend

# Lancé hors Docker (./mvnw depuis backend/), le back lit le .env du projet : même mot de passe
# que la base, rien à exporter. Dans Docker, ce fichier n'existe pas et compose donne les variables.
spring.config.import=optional:file:../.env[.properties]

# Valeurs lues dans les variables d'environnement ; après ":" la valeur par défaut (dev local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/datafit}
spring.datasource.username=${DB_USER:datafit_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.open-in-view=false

# Services Python (simulateur + analyse) ; URL via variables d'env, defaut dev local.
# Dans Docker : SIMULATEUR_URL=http://simulateur:8000, ANALYSE_URL=http://analyse:8001
simulateur.url=${SIMULATEUR_URL:http://localhost:8000}
analyse.url=${ANALYSE_URL:http://localhost:8001}

# Mails (confirmation de l'adresse) envoyés avec Resend. Sans clé, rien ne part : le mail et son
# lien sont écrits dans la console du backend (pratique en développement).
resend.api-key=${RESEND_API_KEY:}
# l'expéditeur : onboarding@resend.dev n'écrit qu'à l'adresse du compte Resend ;
# pour écrire à tout le monde, il faut un domaine vérifié chez Resend
mail.expediteur=${MAIL_EXPEDITEUR:DataFit <onboarding@resend.dev>}
# l'adresse du site, pour le lien du mail (http://localhost:5173 si tu travailles avec Vite)
app.url=${APP_URL:http://localhost:3000}
