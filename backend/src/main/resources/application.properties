spring.application.name=backend

# Lancé hors Docker (./mvnw depuis backend/), le back lit le .env du projet : même mot de passe
# que la base, rien à exporter. Dans Docker, ce fichier n'existe pas et compose donne les variables.
spring.config.import=optional:file:../.env[.properties]

# Valeurs lues dans les variables d'environnement ; après ":" la valeur par défaut (dev local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/datafit}
spring.datasource.username=${DB_USER:datafit_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.open-in-view=false

# Services Python (simulateur + analyse) ; URL via variables d'env, defaut dev local.
# Dans Docker : SIMULATEUR_URL=http://simulateur:8000, ANALYSE_URL=http://analyse:8001
simulateur.url=${SIMULATEUR_URL:http://localhost:8000}
analyse.url=${ANALYSE_URL:http://localhost:8001}

# Relevés originaux des séances, persistés dans un volume Docker dédié.
montre.mesures.dir=${DATAFIT_MESURES_DIR:./donnees-montre}

# Connexion Google : ID client OAuth (vide = pas de bouton Google)
google.client-id=${GOOGLE_CLIENT_ID:}

# Paiement Stripe (page Premium). Clés du tableau de bord Stripe, mode test : sk_test_..., whsec_..., price_...
# Vides = paiement désactivé (la page Premium affiche "Paiement non configuré").
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.prix.mensuel=${STRIPE_PRIX_MENSUEL:}
stripe.prix.annuel=${STRIPE_PRIX_ANNUEL:}
# adresse du site, pour le retour après paiement (5173 en dev avec Vite, 3000 dans Docker)
site.url=${SITE_URL:http://localhost:5173}
