# Modèle des secrets. NE PAS mettre de vraies valeurs ici (ce fichier est commité) :
#   cp k8s/secret.example.yaml k8s/secret.yaml     (secret.yaml est ignoré par Git)
# puis remplace les valeurs de secret.yaml. Voir docs/kubernetes.md.
apiVersion: v1
kind: Secret
metadata:
  name: datafit-secrets
  namespace: datafit
type: Opaque
stringData:
  DB_USER: datafit_user
  DB_PASSWORD: change-moi
  # rôle limité utilisé par le backend (lire et écrire les données, pas toucher aux tables)
  DB_APP_USER: datafit_app
  DB_APP_PASSWORD: change-moi-aussi
  # Paiement Stripe (mode test) : laisser vide = paiement désactivé
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_PRIX_MENSUEL: ""
  STRIPE_PRIX_ANNUEL: ""
  # Connexion Google : laisser vide = pas de bouton Google
  GOOGLE_CLIENT_ID: ""
