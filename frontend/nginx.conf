# Limites d'essais par adresse IP (zones de 10 Mo en mémoire, ~160 000 adresses chacune).
# Le backend a les siennes (AuthInterceptor) : ici, c'est la première barrière, avant même Java.
limit_req_zone $binary_remote_addr zone=connexion:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # n'affiche pas la version de nginx (dans les en-têtes et les pages d'erreur)
    server_tokens off;

    # Derrière un autre proxy (Ingress Kubernetes, hébergeur...), l'adresse vue par nginx est celle du
    # proxy : sans ces lignes, tous les visiteurs partageraient la même limite d'essais. On lit donc
    # la vraie adresse dans X-Forwarded-For, mais seulement quand elle vient d'un proxy du réseau privé.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # En-têtes de sécurité, sur toutes les pages (always : aussi sur les erreurs).
    # CSP : le site ne charge que ses propres fichiers, plus le bouton « Continuer avec Google ».
    #   'unsafe-inline' pour les styles seulement : React pose des style="..." ; aucun script en ligne.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Les appels /api/... sont transmis au conteneur "backend"
    location /api/ {
        proxy_pass http://backend:8080;
        # on garde l'adresse tapée dans le navigateur (localhost:3000) : sans ça, Spring
        # voit arriver "backend:8080", croit l'appel venu d'un autre site et le refuse (CORS)
        proxy_set_header Host $http_host;
        # l'adresse IP du visiteur, pour les limites d'essais du backend
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Connexion, inscription, contact : au plus quelques essais par minute et par adresse IP
    # (burst : une petite rafale tolérée). Chaque bloc répète le proxy, car nginx n'hérite pas
    # des directives d'un autre location.
    location ~ ^/api/auth/(login|register|google)$ {
        limit_req zone=connexion burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/contact {
        limit_req zone=contact burst=3 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Toute autre adresse (/dashboard, /profil...) renvoie index.html :
    # c'est React Router qui choisit la page (même rôle que vercel.json)
    location / {
        try_files $uri /index.html;
    }
}
